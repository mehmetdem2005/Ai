<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sovereign · Editorial Wire — Uzun okuma</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="mobile.css" />
<style>
  .editorial-wrap {
    max-width: 720px; margin: 0 auto; padding: 32px 28px 80px;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--mid); text-decoration: none;
    margin-bottom: 24px;
  }
  .back-link:hover { color: var(--cyan); }

  .meta-row {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--mid);
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    padding: 12px 0; margin-bottom: 28px;
  }
  .meta-row .sid { font-weight: 600; color: var(--ink); letter-spacing: 0.06em; }
  .meta-row .actions { margin-left: auto; display: flex; gap: 8px; }
  .meta-row .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px; font-size: 12px; border: 1px solid var(--ink);
    background: var(--surface); color: var(--ink); cursor: pointer;
    text-decoration: none; font-family: inherit;
  }
  .meta-row .btn.primary { background: var(--ink); color: var(--surface); }

  .kicker {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.1em; color: var(--mid); text-transform: uppercase;
  }
  .body h1 {
    margin: 14px 0 18px;
    font-size: 36px; font-weight: 700; line-height: 1.18;
    letter-spacing: -0.02em;
  }
  .body h2 {
    margin: 36px 0 14px;
    font-size: 20px; font-weight: 700; line-height: 1.3;
  }
  .body h3 {
    margin: 26px 0 10px;
    font-size: 16px; font-weight: 700;
  }
  .body p {
    margin: 0 0 18px;
    font-size: 16.5px; line-height: 1.7; color: var(--ink-2);
  }
  .body strong { color: var(--ink); font-weight: 600; }
  .body blockquote {
    margin: 24px 0; padding: 18px 24px;
    border-left: 4px solid var(--cyan);
    background: var(--cyan-soft); color: var(--ink);
    font-size: 18px; line-height: 1.55; font-weight: 500;
  }
  .body ul, .body ol { padding-left: 24px; margin: 12px 0 20px; }
  .body li { font-size: 16px; line-height: 1.7; margin: 6px 0; color: var(--ink-2); }

  .empty-state {
    text-align: center; padding: 50px 24px;
    border: 1px dashed var(--line); border-radius: var(--radius-lg);
    background: var(--bg-2);
  }
  .empty-state h2 { font-size: 18px; margin: 0 0 8px; }
  .empty-state p { color: var(--mid); font-size: 14px; margin: 0 0 16px; }

  .footer-note {
    margin-top: 36px; padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--mid);
  }
  .footer-note span.mono { font-family: var(--font-mono); }

  .gen-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--cyan); background: var(--cyan); color: #fff;
    border-radius: var(--radius); cursor: pointer; font-family: inherit;
  }
  .gen-btn:hover:not(:disabled) { background: var(--cyan-ink); }
  .gen-btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="topnav-mount"></div>

<div class="editorial-wrap">
  <a class="back-link" href="reader.html"><span data-i18n="editorial.back">← Bültene dön</span></a>

  <div id="loading" style="color: var(--mid);" data-i18n="editorial.loading">Yükleniyor…</div>

  <div id="content" style="display: none;">
    <div class="meta-row" id="metaRow"></div>
    <article class="body" id="body"></article>
    <div class="footer-note" id="footerNote"></div>
  </div>

  <div id="empty" class="empty-state" style="display: none;">
    <h2 data-i18n="editorial.no_long_read">Bu bülten için uzun okuma henüz oluşturulmadı.</h2>
    <p data-i18n="editorial.no_long_read_desc">Admin bu bültenin derinlemesine analizini üretebilir. 1500-2000 kelimelik tek seferlik analiz, ardından cache'lenir.</p>
    <div id="adminGen" style="display: none;">
      <button class="gen-btn" id="genBtn">📖 <span data-i18n="editorial.generate">Uzun analiz üret</span></button>
      <p style="margin-top:12px;font-size:12px;color:var(--mid);" data-i18n="editorial.generate_warn">Üretim 1-2 dakika sürer ve DeepSeek API tüketir.</p>
    </div>
  </div>
</div>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const newsletterId = params.get('bulten');

  const TR_MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  function fmt(d) { return `${d.getDate()} ${TR_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
  function edition(d) { return d.getHours() < 12 ? 'SABAH' : 'AKŞAM'; }

  async function getToken() {
    if (!window.sovSb) return null;
    const { data } = await window.sovSb.auth.getSession();
    return data?.session?.access_token || null;
  }
  async function isAdmin() {
    if (!window.sovSb) return false;
    const { data } = await window.sovSb.auth.getSession();
    return data?.session?.user?.app_metadata?.role === 'admin';
  }

  function downloadLR(lr, d) {
    const blob = new Blob([lr.content], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `uzun-okuma-${d.toISOString().slice(0,10)}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  }
  async function shareLR(d) {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: 'Sovereign uzun okuma · ' + fmt(d), url }); }
      catch {}
    } else {
      try { await navigator.clipboard.writeText(url); alert('Link kopyalandı.'); }
      catch { prompt('Link:', url); }
    }
  }

  function renderLongRead(lr, newsletter) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    const d = new Date(newsletter.created_at);

    const meta = document.getElementById('metaRow');
    meta.innerHTML =
      `<span class="sid">${fmt(d).toUpperCase()} · ${edition(d)} EDİSYONU</span>` +
      `<span>UZUN OKUMA</span>` +
      `<div class="actions">` +
        `<button class="btn" id="dlBtn">⤓ İndir</button>` +
        `<button class="btn primary" id="shBtn">⤴ Paylaş</button>` +
      `</div>`;
    document.getElementById('dlBtn').onclick = () => downloadLR(lr, d);
    document.getElementById('shBtn').onclick = () => shareLR(d);

    // Markdown render — ilk başlık kicker olarak işle, kalan body
    const content = lr.content || '';
    const html = DOMPurify.sanitize(marked.parse(content));
    document.getElementById('body').innerHTML = `<span class="kicker">SOVEREIGN · UZUN OKUMA · ${fmt(d).toUpperCase()}</span>` + html;

    const footerNote = document.getElementById('footerNote');
    footerNote.innerHTML =
      `<strong>Model:</strong> <span class="mono">${lr.model || '—'}</span> · ` +
      `<strong>Üretildi:</strong> ${new Date(lr.generated_at).toLocaleString('tr-TR')}` +
      (lr.generated_by ? ` · <strong>Tetikleyen:</strong> ${lr.generated_by}` : '');
  }

  async function fetchNewsletter(id) {
    const data = await (await fetch('./data.json', { cache: 'no-store' })).json();
    return data.find(n => String(n.id) === String(id));
  }

  async function fetchLongRead(id) {
    const r = await fetch('/api/longread?newsletter_id=' + encodeURIComponent(id));
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('longread fetch failed');
    return await r.json();
  }

  async function generate(id) {
    const token = await getToken();
    if (!token) { alert('Giriş gerekli'); return null; }
    const r = await fetch('/api/longread', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ newsletter_id: id }),
    });
    const out = await r.json();
    if (!r.ok) {
      alert('Hata: ' + (out.error || r.status) + (out.detail ? '\n' + out.detail : ''));
      return null;
    }
    return out;
  }

  async function init() {
    if (!newsletterId) {
      document.getElementById('loading').textContent = 'Bülten ID gerekli (?bulten=N)';
      return;
    }
    let nl;
    try {
      nl = await fetchNewsletter(newsletterId);
    } catch {
      document.getElementById('loading').textContent = 'Bülten bulunamadı.';
      return;
    }
    if (!nl) {
      document.getElementById('loading').textContent = 'Bülten bulunamadı.';
      return;
    }

    let lr;
    try { lr = await fetchLongRead(newsletterId); }
    catch (e) {
      document.getElementById('loading').textContent = 'Sunucu hatası: ' + e;
      return;
    }

    if (lr) {
      renderLongRead(lr, nl);
      return;
    }

    // Yok — empty state göster
    document.getElementById('loading').style.display = 'none';
    document.getElementById('empty').style.display = 'block';

    // Admin'se "Üret" butonunu göster
    if (window.sovSb) {
      const admin = await isAdmin();
      if (admin) {
        document.getElementById('adminGen').style.display = 'block';
        document.getElementById('genBtn').onclick = async function () {
          this.disabled = true;
          const original = this.innerHTML;
          this.innerHTML = '⏳ Üretiliyor… (1-2 dakika)';
          const result = await generate(newsletterId);
          this.disabled = false;
          this.innerHTML = original;
          if (result) renderLongRead(result, nl);
        };
      }
    }
  }

  setTimeout(init, 300);
  setTimeout(() => {
    if (window.sovSb) window.sovSb.auth.onAuthStateChange(init);
  }, 600);
})();
</script>

</body>
</html>
