<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sovereign · Editorial Wire — Bültenler</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Serif+Display&family=Source+Serif+4:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="mobile.css" />
<style>
  .layout {
    display: grid; grid-template-columns: 380px 1fr;
    height: calc(100vh - 130px);
    min-height: 720px;
  }

  aside.list-col {
    border-right: 1px solid var(--line);
    background: var(--surface-2); overflow-y: auto;
  }
  .list-head {
    padding: 22px 24px 14px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--surface-2); z-index: 2;
  }
  .list-head h2 {
    margin: 0; font-family: var(--font-display);
    font-size: 24px; font-weight: 500; letter-spacing: -0.015em;
  }
  .list-head .meta {
    margin-top: 4px;
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--mid); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .filt { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 3px 10px; border: 1px solid var(--line);
    background: transparent;
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-2);
    letter-spacing: 0.04em; cursor: pointer;
  }
  .chip.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  .bull {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line-2);
    cursor: pointer;
    transition: background .15s;
    display: block;
    background: transparent;
  }
  .bull:hover { background: var(--surface); }
  .bull:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: -2px;
  }
  .bull.active {
    background: var(--surface);
    border-left: 3px solid var(--cyan);
    padding-left: 21px;
  }
  .bull .top {
    display: flex; gap: 8px; align-items: baseline;
    font-family: var(--font-mono); font-size: 11px; color: var(--mid);
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bull .top .sid { color: var(--cyan-ink); }
  .bull h4 {
    margin: 10px 0 10px;
    font-family: var(--font-display); font-size: 18px; font-weight: 500;
    line-height: 1.3; letter-spacing: -0.005em; color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: break-word;
  }
  .bull .stats {
    display: flex; gap: 14px; align-items: center;
    font-family: var(--font-mono); font-size: 10.5px; color: var(--mid);
    letter-spacing: 0.04em;
  }
  .bull .stats b { color: var(--ink); font-weight: 500; }
  .bull .stats .pill-mini {
    display: inline-flex; align-items: center;
    padding: 2px 8px; background: var(--bg-2);
    border-radius: 999px; font-size: 10px;
    color: var(--ink-2); letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* Reader */
  main.reader-col { overflow-y: auto; background: var(--bg); }
  .reader-head {
    padding: 18px 40px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
    position: sticky; top: 0; z-index: 2;
  }
  .reader-head .sid {
    font-family: var(--font-mono); font-size: 11px; color: var(--cyan-ink);
    letter-spacing: 0.06em;
  }
  .reader-head .date {
    font-family: var(--font-mono); font-size: 11px; color: var(--mid);
    letter-spacing: 0.06em;
  }
  .reader-head .actions { margin-left: auto; display: flex; gap: 8px; }

  .reader-body {
    padding: 40px 44px 60px; max-width: 720px;
    margin: 0 auto;
  }
  .reader-body h1 {
    margin: 0 0 18px;
    font-family: var(--font-display); font-weight: 500;
    font-size: 34px; line-height: 1.12; letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .reader-body .dek {
    font-family: var(--font-display); font-size: 19px; line-height: 1.5;
    color: var(--ink-2); font-weight: 400;
  }

  .meta-strip {
    margin: 28px 0;
    padding: 16px 0;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .meta-strip .cell { padding: 0 18px; border-right: 1px solid var(--line); }
  .meta-strip .cell:first-child { padding-left: 0; }
  .meta-strip .cell:last-child { border-right: none; padding-right: 0; }
  .meta-strip .k {
    font-family: var(--font-mono); font-size: 9.5px; color: var(--mid);
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .meta-strip .v {
    margin-top: 4px;
    font-family: var(--font-display); font-size: 20px; font-weight: 500;
    letter-spacing: -0.015em; line-height: 1;
  }

  .reader-body h3 {
    margin: 36px 0 10px;
    font-family: var(--font-display); font-weight: 500;
    font-size: 22px; letter-spacing: -0.01em;
    color: var(--ink);
  }
  .reader-body p {
    margin: 14px 0; font-family: var(--font-display);
    font-size: 16.5px; line-height: 1.7; color: var(--ink-2);
  }
  .reader-body p strong { color: var(--ink); font-weight: 500; }
  .reader-body blockquote {
    margin: 28px -20px;
    padding: 24px 28px;
    border-left: 3px solid var(--cyan); background: var(--bg-2);
    font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.32; color: var(--ink);
    text-wrap: pretty;
  }
  .reader-body ul { padding-left: 20px; margin: 16px 0; }
  .reader-body li {
    font-family: var(--font-display);
    font-size: 16px; color: var(--ink-2); margin: 10px 0; line-height: 1.6;
  }

  .src-list {
    margin-top: 36px; padding: 22px;
    border: 1px solid var(--line); background: var(--surface);
  }
  .src-list h4 {
    margin: 0 0 14px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid);
  }
  .src-list ol { padding-left: 0; list-style: none; margin: 0; counter-reset: src; }
  .src-list li {
    counter-increment: src;
    display: grid; grid-template-columns: 36px 1fr 110px; gap: 14px;
    padding: 12px 0; border-bottom: 1px solid var(--line-2);
    font-family: var(--font-display); font-size: 14.5px; line-height: 1.4;
  }
  .src-list li:last-child { border-bottom: none; }
  .src-list li::before {
    content: counter(src, decimal-leading-zero);
    font-family: var(--font-mono); font-size: 11px; color: var(--cyan);
    letter-spacing: 0.04em;
  }
  .src-list .domain {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--mid);
    text-align: right;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
      gap: 0;
    }
    aside.list-col {
      border-right: none;
      border-bottom: 2px solid var(--ink);
      max-height: 360px;
    }
    .list-head { padding: 18px 20px 12px; }
    .list-head h2 { font-size: 20px; }
    .bull { padding: 18px 20px; }
    .bull h4 { font-size: 16px; }

    .reader-head { padding: 14px 20px; flex-wrap: wrap; gap: 10px; }
    .reader-head .actions { width: 100%; margin-left: 0; flex-wrap: wrap; gap: 8px; }
    .reader-body { padding: 32px 20px 56px; }
    .reader-body h1 { font-size: 28px !important; }
    .reader-body .dek { font-size: 16px; }

    .meta-strip { grid-template-columns: 1fr 1fr; }
    .meta-strip .cell { padding: 10px 14px 10px 14px !important; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .meta-strip .cell:nth-child(2n) { border-right: none; }
    .meta-strip .cell:nth-last-child(-n+2) { border-bottom: none; }

    .reader-body blockquote { margin: 24px 0; padding: 18px 20px; font-size: 19px !important; }
    .src-list { padding: 16px; }
    .src-list li { grid-template-columns: 26px 1fr; }
    .src-list .domain { display: none; }
  }

  /* ===== ULTRA-MOBILE (≤ 540px) — Supabase tek kolon ===== */
  @media (max-width: 540px) {
    .layout { gap: 0; }
    aside.list-col {
      max-height: none;
      border-bottom: 1px solid var(--line);
    }
    .list-head {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .list-head h2 { font-size: 22px; letter-spacing: -0.02em; }
    .list-head .meta { font-size: 10px; margin-top: 6px; }

    /* Bull rows — Supabase row pattern: zebra-ish via bg-2 active stripe */
    .bull {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line-2);
    }
    .bull.active {
      border-left-width: 3px;
      padding-left: 17px;
    }
    .bull h4 {
      font-size: 16px;
      margin: 8px 0;
      -webkit-line-clamp: 2;
    }
    .bull .top { font-size: 10.5px; }
    .bull .stats { font-size: 10px; gap: 10px; }

    /* Reader-head: SID + meta tek satır, actions ayrı satır tam-genişlik */
    .reader-head {
      padding: 16px 20px;
      gap: 8px;
    }
    .reader-head .sid { font-size: 10.5px; }
    .reader-head .date { font-size: 10.5px; }
    .reader-head .pill { font-size: 9.5px; padding: 3px 8px; }
    .reader-head .actions {
      width: 100%; margin-left: 0;
      display: flex; gap: 8px;
      flex-wrap: nowrap;
    }
    /* Actions tam-genişlik: 3 buton 1fr 1fr 1fr */
    .reader-head .actions .btn {
      flex: 1 1 0;
      min-height: 44px !important;
      padding: 10px 8px !important;
      font-size: 12.5px !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      justify-content: center;
    }
    /* Primary "Uzun okuma" alır geniş alanı (2x), diğerleri kompakt */
    .reader-head .actions .btn:first-child {
      flex: 1.6 1 0;
    }

    /* Reader body — bol whitespace + compact tipografi */
    .reader-body {
      padding: 28px 20px 60px;
    }
    .reader-body h1 {
      font-size: 26px !important;
      line-height: 1.18 !important;
      margin-bottom: 14px;
    }
    .reader-body .dek {
      font-size: 16px;
      line-height: 1.5;
    }
    .reader-body h3 {
      font-size: 18px !important;
      margin: 28px 0 8px;
    }
    .reader-body p {
      font-size: 16px;
      line-height: 1.65;
      margin: 12px 0;
    }
    .reader-body blockquote {
      margin: 20px 0 !important;
      padding: 16px 18px !important;
      font-size: 17px !important;
      line-height: 1.45 !important;
    }

    /* Meta-strip stack tam dikey — Supabase row */
    .meta-strip {
      grid-template-columns: 1fr !important;
      padding: 8px 0;
      margin: 24px 0;
    }
    .meta-strip .cell {
      padding: 12px 0 !important;
      border-right: none !important;
      border-bottom: 1px solid var(--line-2) !important;
      display: flex; align-items: baseline; gap: 12px;
    }
    .meta-strip .cell:last-child { border-bottom: none !important; }
    .meta-strip .k {
      font-size: 9.5px;
      flex: 0 0 auto;
      min-width: 90px;
    }
    .meta-strip .v {
      font-size: 16px;
      margin-top: 0;
    }

    /* Source list — Supabase compact list */
    .src-list {
      padding: 14px 16px;
      margin-top: 28px;
    }
    .src-list h4 { font-size: 10.5px; margin-bottom: 10px; }
    .src-list li {
      grid-template-columns: 22px 1fr !important;
      gap: 10px;
      padding: 10px 0;
      font-size: 14px;
    }

    /* Filter chips — küçük pill */
    .filt { gap: 6px; margin-top: 12px; }
    .chip {
      padding: 4px 10px;
      font-size: 10.5px;
      min-height: 28px;
      display: inline-flex; align-items: center;
    }
  }

  /* ===== TINY PHONES (≤ 380px) — iPhone SE / mini ===== */
  @media (max-width: 380px) {
    .reader-head .actions .btn {
      font-size: 11.5px !important;
      padding: 10px 6px !important;
    }
    /* Çok dar ekranda secondary butonlardaki text gizle, sadece icon kalsın */
    .reader-head .actions #dlBtn .lbl,
    .reader-head .actions #shBtn .lbl {
      display: none;
    }
    .reader-head .actions #dlBtn,
    .reader-head .actions #shBtn {
      flex: 0 0 48px;
      min-width: 48px;
      padding: 10px 0 !important;
    }
    .reader-head .actions .btn:first-child {
      flex: 1 1 0;
    }
    .reader-body h1 { font-size: 24px !important; }
    .list-head h2 { font-size: 20px; }
  }
</style>
</head>
<body>

<div id="topnav-mount"></div>

<div class="layout">

  <aside class="list-col">
    <div class="list-head">
      <h2 data-i18n="reader.archive_title">Bülten arşivi</h2>
      <div class="meta" data-i18n="reader.archive_meta">GÜNDE 2× · SABAH &amp; AKŞAM EDİSYONLARI</div>
    </div>

    <div id="bullList"></div>
  </aside>

  <main class="reader-col">
    <div class="reader-head" id="readerHead">
      <span class="sid" id="rhSid" data-i18n="reader.loading">Bültenler yükleniyor…</span>
    </div>
    <article class="reader-body" id="readerBody">
      <p style="color: var(--mid); padding: 40px 0;" data-i18n="reader.loading">Bültenler yükleniyor…</p>
    </article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
(function () {
  const TR_MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  function fmt(d) {
    return `${d.getDate()} ${TR_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }
  function edition(d) {
    return d.getHours() < 12 ? "SABAH" : "AKŞAM";
  }
  function timeAgo(d) {
    const ms = Date.now() - d.getTime();
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + " dakika önce yayınlandı";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + " saat önce yayınlandı";
    const days = Math.floor(hrs / 24);
    return days + " gün önce yayınlandı";
  }
  function shortTitle(content) {
    const m = (content || "").match(/^#\s+(.+)$/m);
    let t = m ? m[1] : "Bülten";
    t = t.replace(/^[🧬🚀📊💡⚡🔬]\s*/, "");
    return t.length > 92 ? t.slice(0, 90) + "…" : t;
  }
  function bodyFromContent(content) {
    // Markdown'ı render et — başlık zaten reader-head'de göstereceğiz
    // İlk h1'i kaldır
    const stripped = (content || "").replace(/^#\s+.+$/m, "").replace(/^\*\*Tarih:\*\*.*$/m, "").trim();
    return DOMPurify.sanitize(marked.parse(stripped));
  }
  function download(nl) {
    const blob = new Blob([nl.content], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `bulten_${nl.created_at.slice(0,10)}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  }
  async function share(nl) {
    const url = location.origin + "/?bulten=" + encodeURIComponent(nl.id);
    if (navigator.share) {
      try { await navigator.share({ title: shortTitle(nl.content), url }); }
      catch {}
    } else {
      try { await navigator.clipboard.writeText(url); alert("Link kopyalandı."); }
      catch { prompt("Link:", url); }
    }
  }

  let data = [], current = 0;

  function show(i) {
    current = i;
    const nl = data[i];
    const d = new Date(nl.created_at);
    document.getElementById("rhSid").textContent = `${fmt(d).toUpperCase()} · ${edition(d)}`;
    const head = document.getElementById("readerHead");
    head.innerHTML =
      `<span class="sid">${fmt(d).toUpperCase()} · ${edition(d)}</span>` +
      `<span class="date">·</span>` +
      `<span class="date">${timeAgo(d)}</span>` +
      `<span class="pill ok"><span class="dot"></span><span data-i18n="reader.in_publication">YAYINDA</span></span>` +
      `<div class="actions">` +
        `<a class="btn sm primary" href="editorial.html?bulten=${encodeURIComponent(nl.id)}" data-i18n="reader.long_read" title="Uzun okuma">📖 <span class="lbl">Uzun okuma</span> →</a>` +
        `<button class="btn sm" id="dlBtn" data-i18n="reader.download_btn" title="İndir" aria-label="İndir">⤓ <span class="lbl">İndir</span></button>` +
        `<button class="btn sm" id="shBtn" data-i18n="reader.share_btn" title="Paylaş" aria-label="Paylaş">⤴ <span class="lbl">Paylaş</span></button>` +
      `</div>`;
    document.getElementById("dlBtn").onclick = () => download(nl);
    document.getElementById("shBtn").onclick = () => share(nl);

    document.getElementById("readerBody").innerHTML = bodyFromContent(nl.content);
    document.querySelectorAll(".bull").forEach((el, idx) => el.classList.toggle("active", idx === i));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderList() {
    const wrap = document.getElementById("bullList");
    wrap.innerHTML = "";
    data.forEach((nl, i) => {
      const d = new Date(nl.created_at);
      const div = document.createElement("div");
      div.className = "bull" + (i === 0 ? " active" : "");
      div.innerHTML =
        `<div class="top"><span class="sid">${edition(d)}</span> · ${fmt(d).toUpperCase()}</div>` +
        `<h4>${shortTitle(nl.content)}</h4>` +
        `<div class="stats"><span class="pill-mini">${nl.article_count ?? "?"} sinyal</span><span style="margin-left:auto">Aç →</span></div>`;
      div.onclick = () => show(i);
      wrap.appendChild(div);
    });
  }

  async function load() {
    try {
      const r = await fetch("./data.json", { cache: "no-store" });
      data = await r.json();
    } catch {
      document.getElementById("readerBody").innerHTML = '<p style="color:var(--alert);padding:40px 0;" data-i18n="reader.load_error">Veri yüklenemedi.</p>';
      return;
    }
    if (!data.length) {
      document.getElementById("rhSid").textContent = "";
      document.getElementById("readerBody").innerHTML = '<p style="color:var(--mid);padding:40px 0;" data-i18n="reader.empty_title">Henüz bülten üretilmedi.</p>';
      return;
    }
    renderList();
    show(0);

    // URL ?bulten=ID parametresi varsa o bülteni aç
    const params = new URLSearchParams(location.search);
    const bid = params.get("bulten");
    if (bid) {
      const idx = data.findIndex(n => String(n.id) === bid);
      if (idx >= 0) show(idx);
    }
  }
  load();
})();
</script>

<script src="i18n.js"></script>
<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
</body>
</html>
