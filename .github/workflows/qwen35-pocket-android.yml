name: Build Qwen 3.5 Pocket Android 11 APK

on:
  push:
    branches:
      - 'build/qwen35-pocket-android11'
    paths:
      - 'qwen35-pocket/**'
      - '.github/workflows/qwen35-pocket-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Prepare application
        run: |
          cd qwen35-pocket
          bash prepare.sh
      - name: Build APK
        run: |
          cd qwen35-pocket/upstream/examples/llama.android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Qwen35Pocket-Android11-APK
          path: qwen35-pocket/upstream/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
