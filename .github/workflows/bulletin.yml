name: Sovereign Bülten Cron

on:
  # SCHEDULE DEVRE DIŞI — V2 (sovereign-daily.yml) ile değiştirildi.
  # Bu workflow eski "tek karma günlük bülten" mantığıyla çöp özetler üretiyordu:
  # somut sayı yerine "oyun değiştirici nitelikte" klişeleri. V2'nin niş-bazlı,
  # 3-satır + somut sayı + TR pratik etkisi formatı çok daha kaliteli.
  # Acil durumda manuel tetikleme için workflow_dispatch korundu.
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # UTF-8 garantisi — Ubuntu runner default C.UTF-8 ama bazen alt-process'lerde
      # düşebiliyor; Python source ve LLM I/O'da Türkçe karakterler ASCII'ye düşmesin.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RUN_MODE: once
      LLM_PROVIDER: deepseek
      DEEPSEEK_MODEL: deepseek-v4-pro
      GEMINI_MODEL: gemini-2.5-flash
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-small
      DEDUP_THRESHOLD: "0.86"
      MAX_ENTRIES_PER_FEED: "10"
      # V3 — filtreleme/yayın ayarları (secret veya boş → kod varsayılanı kullanılır)
      MAX_NEW_PER_SOURCE: ${{ vars.MAX_NEW_PER_SOURCE }}
      MIN_IMPACT_SCORE: ${{ vars.MIN_IMPACT_SCORE }}
      MAX_PUBLISHED: ${{ vars.MAX_PUBLISHED }}
      # V3 — auto-publish emniyet sübabı (Streamlit deploy edilmediyse cron'un tek yayın yolu)
      AUTO_PUBLISH_AFTER_HOURS: ${{ vars.AUTO_PUBLISH_AFTER_HOURS }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # V3 — Beehiiv (secret yoksa auto-publish Beehiiv adımını atlar, site yine güncellenir)
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      BEEHIIV_PUB_ID: ${{ secrets.BEEHIIV_PUB_ID }}
      # V3 — opsiyonel uptime heartbeat
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Bülteni üret
        run: python main.py once
      - name: Bülteni artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: outputs/*.md
          if-no-files-found: ignore
